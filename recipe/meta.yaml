{% set name = "ttsim-backend" %}
{% set version = "1.3.1" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/ttsim_backend-{{ version }}.tar.gz
  sha256: 481c21747cf5ac6056d704a2b2a8a955e956c8b1874dd2475b144e95c51d75db

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >={{ python_min }}
    - beartype >=0.18
    - dags >=0.6
    - ipywidgets
    - jaxtyping >=0.3.10
    - python-kaleido >=1.1
    - networkx >=3.5
    - numpy_groupies
    - numpy
    - openpyxl
    - optree >=0.16.0
    - pandas >=3
    - pint >=0.25
    - plotly >=6.5
    - portion
    - pygments
    - pygraphviz
    - pytest
    - pyyaml

test:
  imports:
    - ttsim
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  summary: code powering Taxes and Transfers SIMulators
  license: AGPL-3.0-only
  license_file: LICENSE
  home: https://github.com/ttsim-dev/ttsim

extra:
  recipe-maintainers:
    - hmgaudecker
    - MImmesberger
